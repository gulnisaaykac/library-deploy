# ============================================================
# UI Service (template)
# Amac: UI'yi NodePort ile disari acmak.
# Isim/label release'e bagli; mevcut library-ui Service ile cakışmaz.
# ============================================================

apiVersion: v1 # Service core API
kind: Service # Disari kapı
metadata:
  name: {{ include "library.fullname" . }}-ui # Ornek: librarytest-ui
  labels:
    app: {{ include "library.fullname" . }}-ui # Kaynak etiketi
spec:
  type: {{ .Values.ui.service.type }} # NodePort
  selector:
    app: {{ include "library.fullname" . }}-ui # UI Pod'larina yonlendir
  ports:
    - name: http # Port adi
      port: {{ .Values.ui.service.port }} # Cluster icinden 80
      targetPort: http # Deployment'taki name: http portuna git
      nodePort: {{ .Values.ui.service.nodePort }} # Disari sabit kapı