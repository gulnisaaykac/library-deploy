# ============================================================
# library Helm chart - API Deployment (template)
# Amac: Mevcut api.yaml’deki mantığı Helm’e taşıyıp
#       values.yaml içinden api.* ayarlarını çekmek.
#
# Not:
# - ConfigMap/Secret adları şimdilik sabit (mevcut cluster kaynakları).
# - name/label Helm release adina bagli; mevcut library-api ile cakışmaz.
# ============================================================

apiVersion: apps/v1 # Deployment icin apps/v1
kind: Deployment # Kaynak tipi: ReplicaSet + Pod yonetir
metadata:
  # Release adi + "-api" (ornek: librarytest-api)
  name: {{ include "library.fullname" . }}-api
  labels:
    # Service selector ile ayni olmali
    app: {{ include "library.fullname" . }}-api
spec:
  # Kac API Pod calissin (values.yaml: api.replicaCount)
  replicas: {{ .Values.api.replicaCount }}
  selector:
    # Hangi Pod'lara sahip olacagini label ile secer
    matchLabels:
      app: {{ include "library.fullname" . }}-api
  template:
    # Her yeni Pod bu sablondan uretilir
    metadata:
      labels:
        # Pod etiketi; selector ile birebir ayni olmali
        app: {{ include "library.fullname" . }}-api
    spec:
      # Ana container'dan once calisir; SQL portu acilinca biter
      initContainers:
        - name: wait-for-sql # Init container adi
          image: busybox:1.36 # Kucuk imaj; nc komutu icin
          command:
            - sh # Shell
            - -c # Sonraki string'i komut olarak calistir
            - |
              echo "SQL bekleniyor (host.minikube.internal:1433)..."
              until nc -z host.minikube.internal 1433; do
                echo "SQL henuz yok, 2sn sonra tekrar..."
                sleep 2
              done
              echo "SQL portu acik, init bitti."
      containers:
        - name: library-api # Konteyner adi (Deployment adindan bagimsiz)
          # Imaj: repository:tag values'dan gelir
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }} # Never = local imaj
          ports:
            - containerPort: {{ .Values.api.service.port }} # Konteynerin dinledigi port
          resources:
            requests:
              cpu: "100m" # En az 0.1 CPU
              memory: "256Mi" # En az 256Mi RAM
            limits:
              cpu: "500m" # En fazla 0.5 CPU
              memory: "512Mi" # En fazla 512Mi RAM
          startupProbe:
            httpGet:
              path: /health/live # Canlilik endpoint'i
              port: {{ .Values.api.service.port }} # Probe portu
            failureThreshold: 30 # 30 fail olursa Pod basarisiz
            periodSeconds: 2 # 2 sn'de bir dene
          livenessProbe:
            httpGet:
              path: /health/live # Hala canli mi
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 10 # Ilk kontrol 10 sn sonra
            failureThreshold: 3 # 3 fail -> restart
            periodSeconds: 10 # 10 sn'de bir
          readinessProbe:
            httpGet:
              path: /health/ready # Trafik almaya hazir mi
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 5
            failureThreshold: 3 # Fail olursa restart yok, trafik kesilir
            periodSeconds: 5
          env:
            - name: ASPNETCORE_ENVIRONMENT # .