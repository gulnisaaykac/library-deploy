# ============================================================
# library Helm chart - API Deployment (template)
# Amac: Mevcut api.yaml’deki mantığı Helm’e taşıyıp
#       values.yaml içinden api.* ayarlarını çekmek.
#
# Not:
# - ConfigMap/Secret adları şimdilik sabit.
# - Minikube’daki mevcut deploy ile çakışmaması için
#   bugün sadece helm template ile render kontrolü hedeflenir.
# ============================================================

apiVersion: apps/v1 # Deployment için apps/v1
kind: Deployment
metadata:
  # Deployment adı: mevcut sistemle aynı kalsın ki label/service uyumu olsun
  name: library-api
  labels:
    # Label: podları service/deployment eşleştirmesinde kullanıyoruz
    app: library-api
spec:
  # Kaç replica (values.yaml: api.replicaCount)
  replicas: {{ .Values.api.replicaCount }}

  selector:
    # Service/Deployment hangi pod’lara yönelecek?
    matchLabels:
      app: library-api

  template:
    # Pod şablonu
    metadata:
      labels:
        app: library-api

    spec:
      # SQL hazır olana kadar ana container’ı başlatma (InitContainer)
      initContainers:
        - name: wait-for-sql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # 1433 portu açılana kadar bekle
              echo "SQL bekleniyor (host.minikube.internal:1433)..."
              until nc -z host.minikube.internal 1433; do
                echo "SQL henuz yok, 2sn sonra tekrar..."
                sleep 2
              done
              echo "SQL portu acik, init bitti."

      containers:
        - name: library-api
          # İmaj: values.yaml’dan gelir
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }} # Never = local imaj

          # API konteyner portu (values.yaml: api.service.port)
          ports:
            - containerPort: {{ .Values.api.service.port }}

          # CPU/RAM limit & request (şimdilik sabit yazdım)
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Startup: uygulama ilk açılırken “erken” başarısız denemesini engeller
          startupProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.api.service.port }}
            failureThreshold: 30 # örn. 30 denemede vazgeç
            periodSeconds: 2

          # Liveness: “hala canlı mı?” (bozulursa restart)
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 10
            failureThreshold: 3
            periodSeconds: 10

          # Readiness: “servis vermeye hazır mı?” (ready değilse traffic yemez)
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 5
            failureThreshold: 3
            periodSeconds: 5

          # Ortam değişkenleri:
          #