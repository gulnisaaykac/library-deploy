# ============================================================
# library Helm chart - API Deployment (template)
# Amac: api.yaml mantigini Helm'e tasiyip values.yaml'dan
#       api.* okumak. ConfigMap adi release'e bagli.
# Secret adi simdilik sabit: library-api-secret (cluster'daki)
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  # Ornek: librarytest-api
  name: {{ include "library.fullname" . }}-api
  labels:
    app: {{ include "library.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "library.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "library.fullname" . }}-api
    spec:
      initContainers:
        - name: wait-for-sql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "SQL bekleniyor (host.minikube.internal:1433)..."
              until nc -z host.minikube.internal 1433; do
                echo "SQL henuz yok, 2sn sonra tekrar..."
                sleep 2
              done
              echo "SQL portu acik, init bitti."
      containers:
        - name: library-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.api.service.port }}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 10
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 5
            failureThreshold: 3
            periodSeconds: 5
          env:
            # --- ConfigMap (chart uretir) ---
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "library.fullname" . }}-api-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "library.fullname" . }}-api-config
                  key: ASPNETCORE_URLS
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: {{ include "library.fullname" . }}-api-config
                  key: Jwt__Issuer
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: {{ include "library.fullname" . }}-api-config
                  key: Jwt__Audience
            - name: Groq__Model
              valueFrom:
                configMapKeyRef:
                  name: {{ include "library.fullname" . }}-api-config
                  key: Groq__Model
            # --- Secret (cluster'daki mevcut secret, chart'ta yok) ---
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: library-api-secret
                  key: ConnectionStrings__DefaultConnection
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: library-api-secret
                  key: Jwt__Key
            - name: Groq__ApiKey
              valueFrom:
                secretKeyRef:
                  name: library-api-secret
                  key: Groq__ApiKey