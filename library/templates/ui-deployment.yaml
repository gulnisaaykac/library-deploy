# ============================================================
# UI Deployment (template)
# Amac: values.yaml içindeki ui.* ayarlarıyla
#       nginx (Angular UI) container'ını ayağa kaldırmak.
# ============================================================

apiVersion: apps/v1 # Deployment
kind: Deployment
metadata:
  # Mevcut deploy ile çakışmaması için sabit isim kullanıyoruz
  name: library-ui
  labels:
    app: library-ui
spec:
  replicas: {{ .Values.ui.replicaCount }} # replicas values'tan gelir
  selector:
    matchLabels:
      app: library-ui
  template:
    metadata:
      labels:
        app: library-ui
    spec:
      containers:
        - name: library-ui
          # nginx/angular imajı values'tan gelir
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }} # Never = local imaj
          ports:
            - name: http
              containerPort: 80

          # kaynak ayarı (sende api'deki gibi tanımlı değil; örnek değerler)
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          # UI'nin health check'leri (sende api.yaml'deki probe mantığı)
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5