# ============================================================
# library Helm chart - API Service (template)
# Amac: API Pod'larina NodePort ile kapı acmak.
# Isim/label release'e bagli; mevcut library-api Service ile cakışmaz.
# ============================================================

apiVersion: v1 # Service icin core API
kind: Service # Cluster icinde sabit DNS + port
metadata:
  name: {{ include "library.fullname" . }}-api # Ornek: librarytest-api
  labels:
    app: {{ include "library.fullname" . }}-api # Kaynagi etiketle
spec:
  type: {{ .Values.api.service.type }} # NodePort (values.yaml)
  selector:
    app: {{ include "library.fullname" . }}-api # Hangi Pod'lara trafik
  ports:
    - name: http # Port adi
      port: {{ .Values.api.service.port }} # Cluster icinden gelen port
      targetPort: {{ .Values.api.service.port }} # Pod icindeki gercek port
      nodePort: {{ .Values.api.service.nodePort }} # Disari sabit kapı